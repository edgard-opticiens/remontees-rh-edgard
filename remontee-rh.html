<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Remontée RH — Groupe Edgard</title>
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest-remontee-rh.json">
<link rel="apple-touch-icon" href="icon-remontee-192.png">
<link rel="icon" href="icon-remontee-192.png">
<style>
  :root{
    --noir:#111111;
    --noir-clair:#1c1c1c;
    --or:#c49b4e;
    --or-clair:#e3c988;
    --gris:#6b6b6b;
    --fond:#f6f5f2;
    --rouge:#b3413a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI', Inter, -apple-system, sans-serif;
    background:var(--fond);
    color:var(--noir);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:24px 16px 48px;
  }
  header{
    width:100%;
    max-width:560px;
    text-align:center;
    margin-bottom:20px;
  }
  header .badge{
    display:inline-block;
    background:var(--noir);
    color:var(--or);
    font-size:12px;
    letter-spacing:.14em;
    text-transform:uppercase;
    padding:6px 14px;
    border-radius:999px;
    margin-bottom:14px;
  }
  h1{
    font-size:26px;
    margin:0 0 6px;
    letter-spacing:.01em;
  }
  header p{
    color:var(--gris);
    font-size:14.5px;
    margin:0;
    line-height:1.5;
  }
  form{
    width:100%;
    max-width:560px;
    background:#fff;
    border-radius:16px;
    padding:26px 24px 24px;
    box-shadow:0 10px 30px rgba(0,0,0,.06);
    border:1px solid rgba(0,0,0,.05);
  }
  .champ{margin-bottom:18px;}
  label{
    display:block;
    font-size:13px;
    font-weight:600;
    color:var(--noir-clair);
    margin-bottom:6px;
  }
  label .opt{
    font-weight:400;
    color:var(--gris);
    text-transform:none;
    letter-spacing:0;
  }
  input[type=text], select, textarea{
    width:100%;
    padding:11px 12px;
    border-radius:10px;
    border:1.5px solid #e2e0da;
    font-size:15px;
    font-family:inherit;
    background:#fdfdfc;
    transition:border-color .15s;
  }
  input[type=text]:focus, select:focus, textarea:focus{
    outline:none;
    border-color:var(--or);
  }
  textarea{resize:vertical; min-height:110px;}
  .urgence-choix{
    display:flex;
    gap:10px;
  }
  .urgence-choix label{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:11px 10px;
    border-radius:10px;
    border:1.5px solid #e2e0da;
    cursor:pointer;
    font-size:14px;
    font-weight:600;
    color:var(--gris);
    margin:0;
    transition:all .15s;
  }
  .urgence-choix input{display:none;}
  .urgence-choix input:checked + span{color:inherit;}
  .urgence-choix label:has(input:checked){
    border-color:var(--noir);
    background:var(--noir);
    color:#fff;
  }
  .urgence-choix label.urgent:has(input:checked){
    border-color:var(--rouge);
    background:var(--rouge);
  }
  button[type=submit]{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:var(--noir);
    color:var(--or-clair);
    font-size:15.5px;
    font-weight:700;
    letter-spacing:.02em;
    cursor:pointer;
    margin-top:6px;
    transition:transform .1s, opacity .15s;
  }
  button[type=submit]:active{transform:scale(.98);}
  button[type=submit]:disabled{opacity:.6; cursor:default;}
  .statut{
    margin-top:16px;
    padding:13px 14px;
    border-radius:10px;
    font-size:14px;
    font-weight:600;
    display:none;
  }
  .statut.ok{display:block; background:#eaf6ec; color:#2b6a3a;}
  .statut.err{display:block; background:#fbeceb; color:#a33b33;}
  footer{
    margin-top:22px;
    font-size:12px;
    color:var(--gris);
    text-align:center;
  }
</style>
</head>
<body>

<header>
  <span class="badge">Groupe Edgard</span>
  <h1>Faire une remontée RH</h1>
  <p>Un sujet important à signaler à la responsable&nbsp;? Décris-le ci-dessous, elle est prévenue immédiatement.</p>
</header>

<form id="formRemontee">
  <div class="champ">
    <label for="marque">Enseigne</label>
    <select id="marque" name="marque" required>
      <option value="" disabled selected>Choisir…</option>
      <option value="Edgard Opticiens">Edgard Opticiens</option>
      <option value="Générale d'Optique">Générale d'Optique</option>
      <option value="Edgard Développement">Edgard Développement (siège)</option>
    </select>
  </div>

  <div class="champ">
    <label for="magasin">Magasin / service</label>
    <input type="text" id="magasin" name="magasin" placeholder="Ex : Nice Masséna" required>
  </div>

  <div class="champ">
    <label for="nom">Envoyé par</label>
    <select id="nom" name="nom" required>
      <option value="" disabled selected>Choisir…</option>
      <option value="Aurélie">Aurélie</option>
      <option value="Audrey">Audrey</option>
      <option value="Jonathan">Jonathan</option>
    </select>
  </div>

  <div class="champ">
    <label for="objet">Objet</label>
    <input type="text" id="objet" name="objet" placeholder="Ex : Conflit planning entre deux salariées" required maxlength="120">
  </div>

  <div class="champ">
    <label>Urgence</label>
    <div class="urgence-choix">
      <label class="normal">
        <input type="radio" name="urgence" value="normal" checked>
        <span>🔔 Normal</span>
      </label>
      <label class="urgent">
        <input type="radio" name="urgence" value="urgent">
        <span>🔴 Urgent</span>
      </label>
    </div>
  </div>

  <div class="champ">
    <label for="description">Description</label>
    <textarea id="description" name="description" placeholder="Explique la situation en quelques phrases…" required></textarea>
  </div>

  <button type="submit" id="btnEnvoyer">Envoyer à la responsable</button>

  <div class="statut" id="statutMessage"></div>
</form>

<footer>Groupe Edgard — Outil RH interne</footer>

<script>
// URL du webhook n8n (production). À adapter si le nom de path change côté n8n.
const WEBHOOK_URL = "https://edgard-opticiens.app.n8n.cloud/webhook/remontee-rh";

const form = document.getElementById("formRemontee");
const statutEl = document.getElementById("statutMessage");
const btn = document.getElementById("btnEnvoyer");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  statutEl.className = "statut";
  statutEl.textContent = "";
  btn.disabled = true;
  btn.textContent = "Envoi en cours…";

  const payload = {
    marque: form.marque.value,
    magasin: form.magasin.value.trim(),
    nom: form.nom.value.trim(),
    objet: form.objet.value.trim(),
    urgence: form.querySelector('input[name="urgence"]:checked').value,
    description: form.description.value.trim(),
    date: new Date().toISOString().slice(0, 10)
  };

  try {
    const res = await fetch(WEBHOOK_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    if (!res.ok) throw new Error("Réponse serveur invalide");

    statutEl.className = "statut ok";
    statutEl.textContent = "✅ Envoyé — la responsable vient de recevoir une notification.";
    form.reset();
    form.querySelector('input[name="urgence"][value="normal"]').checked = true;
  } catch (err) {
    statutEl.className = "statut err";
    statutEl.textContent = "⚠️ Échec de l'envoi. Vérifie ta connexion et réessaie.";
  } finally {
    btn.disabled = false;
    btn.textContent = "Envoyer à la responsable";
  }
});

// Rend la page installable comme une application (raccourci bureau/mobile)
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw-remontee-rh.js").catch(() => {});
  });
}
</script>

</body>
</html>
